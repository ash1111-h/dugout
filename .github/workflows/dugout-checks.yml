name: Dugout checks (data, schedule, game)

on:
  push:
    branches: [main, 'dugout-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned SABR Lahman 2025 CSV source
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/cbwinslow/lahman-database-csv/0377e0b8d3f1b8f6710cc4faee7d842d0e81f344/data"
          for file in People.csv Appearances.csv Teams.csv AllstarFull.csv AwardsPlayers.csv HallOfFame.csv readme2025.txt; do
            curl --fail --location --retry 4 --retry-delay 2 "$BASE/$file" --output "$file"
          done
          echo "Downloaded source files:"
          wc -c People.csv Appearances.csv Teams.csv AllstarFull.csv AwardsPlayers.csv HallOfFame.csv readme2025.txt
          grep -m1 -E '^The SABR Lahman Baseball Database' readme2025.txt

      - name: Rebuild the roster from the pre-2.0 page (reproducibility check)
        shell: bash
        run: |
          set -euo pipefail
          git show d32596a:index.html > index-legacy.html   # pinned pre-2.0 page
          python tools/build_dugout_database.py index-legacy.html People.csv Appearances.csv Teams.csv \
            --allstar AllstarFull.csv --awards AwardsPlayers.csv --hof HallOfFame.csv \
            --output index-updated.html
          python tools/splice_data.py index-updated.html index.html index-rebuilt.html
          python tools/apply_schedule.py index-rebuilt.html data/daily-schedule-v1.json
          node - <<'JS'
          const fs = require('fs');
          const get = f => fs.readFileSync(f, 'utf8').match(/const D = (\{.*?\});\s*\n\(function \(\) \{/s)[1];
          if (get('index-rebuilt.html') !== get('index.html')) { console.error('Embedded data in index.html does not match a fresh rebuild'); process.exit(1); }
          console.log('Embedded data reproduces exactly from the pinned Lahman source.');
          JS

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=/<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/g;let x,i=0;while((x=m.exec(h)))fs.writeFileSync('inline'+(i++)+'.js',x[1]);"
          for f in inline*.js tests/*.js tools/*.js; do node --check "$f"; done

      - name: Database, graph and schedule audit
        run: node tests/audit_db.js index.html d32596a origin/main

      - name: Modern-player coverage simulation
        run: node tests/coverage_sim.js index.html 150 400 | tee coverage-report.json

      - name: Browser interaction tests (Chromium, desktop and iPhone-sized)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node tests/browser_test.js "$RUNNER_TEMP/shots"

      - name: Football and basketball pages (reproducible from committed data, audits, simulations)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_sports_pages.py .
          git diff --exit-code -- football.html basketball.html || { echo 'football.html/basketball.html are out of date: run tools/build_sports_pages.py'; exit 1; }
          node tests/audit_sports.js
          node tests/sport_sim.js football.html 100 150 | tee football-sim.json
          node tests/sport_sim.js basketball.html 100 150 | tee basketball-sim.json

      - name: Sport page browser tests
        shell: bash
        run: node tests/sports_browser_test.js "$RUNNER_TEMP/sport-shots"

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload migrated preview and audit summary
        uses: actions/upload-artifact@v4
        with:
          name: dugout-2025-migration-preview
          path: |
            index-updated.html
            coverage-report.json
            People.csv
            Appearances.csv
            Teams.csv
            readme2025.txt
          if-no-files-found: error
          retention-days: 14
